---
- name: "Enable IOMMU"
  when: allow_reboot
  become: true
  block:
    - name: "Determine which bootloader is used"
      ansible.builtin.command: efibootmgr -v
      register: efibootmgr_output
      changed_when: false
      # Read-only detection. Without this the task is skipped under --check,
      # leaving `bootloader` undefined and failing the role's own assert, so
      # the command line changes below could never be dry-run.
      check_mode: false
      ignore_errors: true

    - name: "Set bootloader to GRUB if EFI variables indicate GRUB"
      ansible.builtin.set_fact:
        bootloader: "GRUB"
      when:
        - efibootmgr_output.stdout is defined
        - ('shimx64.efi' in efibootmgr_output.stdout or 'grubx64.efi' in efibootmgr_output.stdout)

    - name: "Set bootloader to systemd-boot if EFI variables indicate systemd-boot"
      ansible.builtin.set_fact:
        bootloader: "systemd-boot"
      when:
        - efibootmgr_output.stdout is defined
        - ('systemd-bootx64.efi' in efibootmgr_output.stdout)

    - name: "Fail if bootloader cannot be determined"
      ansible.builtin.assert:
        that:
          - bootloader != ""
        fail_msg: "Bootloader could not be determined from efibootmgr output."

    - name: "Detect CPU type"
      ansible.builtin.set_fact:
        cpu_type: >-
          {{
            'AMD' if 'AMD' in ansible_facts['processor'][1] else
            'Intel' if 'Intel' in ansible_facts['processor'][1] else
            'UNKNOWN' | trim
          }}

    - name: "Fail if bootloader cannot be determined"
      ansible.builtin.assert:
        that:
          - cpu_type != "UNKNOWN"
        fail_msg: "cpu_type could not be determined from ansible facts: {{ ansible_facts['processor'] }}"

    - name: "Set the IOMMU kernel parameters based on CPU type"
      # Each parameter is carried as a name/value pair rather than one string,
      # so the tasks below can update or append them individually. The kernel
      # command line is shared with the `hugepages` and `scaling_governor`
      # roles; rewriting the whole line here would silently drop whatever those
      # roles added (hugepages=, amd_pstate=, ...).
      ansible.builtin.set_fact:
        iommu_kernel_parameters: >-
          {{
            [{'name': 'iommu', 'value': 'pt'}]
            if cpu_type == 'AMD'
            else [{'name': 'intel_iommu', 'value': 'on'},
                  {'name': 'iommu', 'value': 'pt'}]
          }}

    - name: "Configure IOMMU for GRUB"
      when: bootloader == "GRUB"
      block:
        - name: "Set GRUB IOMMU parameter values"
          ansible.builtin.replace:
            path: /etc/default/grub
            regexp: '(?<!\S){{ item.name }}=[^\s"]+'
            replace: "{{ item.name }}={{ item.value }}"
          loop: "{{ iommu_kernel_parameters }}"
          loop_control:
            label: "{{ item.name }}={{ item.value }}"

        - name: "Add missing GRUB IOMMU parameters"
          ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")(?![^"]*\b{{ item.name }}=)([^"]*)"$'
            line: '\1\2 {{ item.name }}={{ item.value }}"'
            backrefs: true
          loop: "{{ iommu_kernel_parameters }}"
          loop_control:
            label: "{{ item.name }}={{ item.value }}"

        - name: "Update GRUB configuration"
          ansible.builtin.command: update-grub
          changed_when: false

        - name: "Reboot the system if allowed"
          ansible.builtin.reboot:
            msg: "Rebooting to apply IOMMU changes"
            connect_timeout: 5
            reboot_timeout: 600
            pre_reboot_delay: 5
            post_reboot_delay: 30
            test_command: uptime
          when: allow_reboot
      rescue:
        - name: "IOMMU for GRUB failed"
          ansible.builtin.set_fact:
            task_failed: true

    - name: "Configure IOMMU for systemd-boot"
      when: bootloader == "systemd-boot"
      block:
        - name: "Set systemd-boot IOMMU parameter values"
          ansible.builtin.replace:
            path: /etc/kernel/cmdline
            regexp: '(?<!\S){{ item.name }}=[^\s"]+'
            replace: "{{ item.name }}={{ item.value }}"
          loop: "{{ iommu_kernel_parameters }}"
          loop_control:
            label: "{{ item.name }}={{ item.value }}"

        - name: "Add missing systemd-boot IOMMU parameters"
          ansible.builtin.lineinfile:
            path: /etc/kernel/cmdline
            regexp: '^(?!.*(?:^|\s){{ item.name }}=)(.*\S)\s*$'
            line: '\1 {{ item.name }}={{ item.value }}'
            backrefs: true
          loop: "{{ iommu_kernel_parameters }}"
          loop_control:
            label: "{{ item.name }}={{ item.value }}"

        - name: "Refresh systemd-boot configuration"
          ansible.builtin.command: pve-efiboot-tool refresh
          changed_when: false

        - name: "Reboot the system if allowed"
          ansible.builtin.reboot:
            msg: "Rebooting to apply IOMMU changes"
            connect_timeout: 5
            reboot_timeout: 600
            pre_reboot_delay: 5
            post_reboot_delay: 30
            test_command: uptime
          when: allow_reboot
      rescue:
        - name: "IOMMU for systemd-boot failed"
          ansible.builtin.set_fact:
            task_failed: true

    - name: "Verify IOMMU is enabled"
      ansible.builtin.shell: >-
        set -o pipefail;
        dmesg | grep -e IOMMU
      register: iommu_check
      args:
        executable: /bin/bash
      changed_when: false

    - name: "Display IOMMU check result"
      ansible.builtin.debug:
        var: iommu_check.stdout
  rescue:
    - name: "Enable IOMMU failed"
      ansible.builtin.set_fact:
        task_failed: true
