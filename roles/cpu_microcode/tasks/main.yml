---
- name: "Current ansible processor"
  ansible.builtin.debug:
    msg: "{{ ansible_facts['processor'] }}"

- name: "Set the vendor name"
  ansible.builtin.set_fact:
    cpu_vendor: "{{ ansible_facts['processor'][1] }}"

- name: "Current processor vendor name"
  ansible.builtin.debug:
    msg: "{{ cpu_vendor }}"

# The Debian base/security/updates repos (including the non-free-firmware
# component that ships intel-microcode / amd-microcode) are owned by the
# fix_package_repos role, which runs earlier in main.yml and writes them as
# deb822 ".sources". This role used to re-add them with apt_repository, which
# (a) is deprecated in favour of deb822_repository and (b) recreated the exact
# legacy ".list" files that fix_package_repos deletes, re-triggering apt's
# "configured multiple times" warnings on every subsequent apt run.

- name: "Update package cache (apt)"
  apt:
    update_cache: true
  become: true

- name: "Install package for intel"
  package:
    name: "{{ intel_microcode_package }}"
    state: present
  when: "'Intel' in cpu_vendor"
  become: true
  notify: "Restart to install microcode"

- name: "Install package for amd"
  package:
    name: "{{ amd_microcode_package }}"
    state: present
  when: "'AMD' in cpu_vendor"
  become: true
  notify: "Restart to install microcode"
  become_method: ansible.builtin.su

- name: "Check Microcode version"
  ansible.builtin.command: cat /proc/cpuinfo
  register: microcode_version
  changed_when: false

- name: "Current microcode version"
  ansible.builtin.debug:
    msg: "{{ microcode_version.stdout }} Expect 0x12 after install (0xe by default on N100)"
