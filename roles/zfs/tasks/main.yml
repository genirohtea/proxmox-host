---
# tasks file for zfs

# Example pool rename:
# zpool export vm-nvme-pool; zpool import vm-nvme-pool pool-vm-nvme
# nano /etc/pve/storage.cfg

# Example RAID-0
# zpool create surveillancepool /dev/sdg /dev/sdh

# Example pool trim
#  zpool set autotrim=on vm-nvme-pool

# tasks file for configuring ZFS pool checks
- name: "Setup ZFS pool monitoring"
  block:
    - name: "Install required dependencies for ZFS pool checks"
      ansible.builtin.package:
        name: zfsutils-linux
        state: present
      become: true

    - name: "Create script directory for ZFS pool checks"
      ansible.builtin.file:
        path: "/etc/zfs_smart_check/scripts"
        state: directory
        owner: root
        group: root
        mode: 0755
      register: zfs_pool_script_dir

    - name: "Copy ZFS pool check script to the host"
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ zfs_pool_script_dir.path }}/"
        owner: root
        group: root
        mode: 0755
      with_fileglob:
        - "files/*"

    - name: "Remove the retired ZFS SMART shell script"
      ansible.builtin.file:
        path: /etc/zfs_smart_check/scripts/zfs_pool_check.sh
        state: absent
      become: true

    - name: "Configure the ZFS pool check timer"
      ansible.builtin.import_tasks: autostart.yml
  rescue:
    - name: "ZFS pool check installation failed"
      ansible.builtin.set_fact:
        task_failed: true
