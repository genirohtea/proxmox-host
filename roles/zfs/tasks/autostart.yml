---
# The Python pool check supersedes the old shell implementation.

- name: Create systemd service file for the ZFS pool check
  ansible.builtin.template:
    src: templates/zfs_pool_check_py.service.j2
    dest: /etc/systemd/system/zfs_pool_check_py.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for ZFS pool checks

- name: Create systemd timer file for the ZFS pool check
  ansible.builtin.template:
    src: templates/zfs_pool_check_py.timer.j2
    dest: /etc/systemd/system/zfs_pool_check_py.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for ZFS pool checks

- name: Create systemd service file for ZFS health metrics
  ansible.builtin.template:
    src: templates/zfs_health_metrics.service.j2
    dest: /etc/systemd/system/zfs_health_metrics.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for ZFS pool checks

- name: Create systemd timer file for ZFS health metrics
  ansible.builtin.template:
    src: templates/zfs_health_metrics.timer.j2
    dest: /etc/systemd/system/zfs_health_metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for ZFS pool checks

- name: Check whether the legacy shell timer exists
  ansible.builtin.stat:
    path: /etc/systemd/system/zfs_pool_check.timer
  register: zfs_pool_check_legacy_timer

- name: Retire the legacy shell ZFS SMART check timer
  ansible.builtin.systemd:
    name: zfs_pool_check.timer
    state: stopped
    enabled: false
  when: zfs_pool_check_legacy_timer.stat.exists

- name: Remove the legacy shell ZFS SMART check unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - zfs_pool_check.service
    - zfs_pool_check.timer
  notify: Reload systemd for ZFS pool checks

- name: Reload systemd before enabling the ZFS pool check timer
  ansible.builtin.meta: flush_handlers

- name: Enable the ZFS pool check timer to start on boot
  ansible.builtin.systemd:
    name: zfs_pool_check_py.timer
    enabled: true

- name: Start the ZFS pool check timer
  ansible.builtin.systemd:
    name: zfs_pool_check_py.timer
    state: started
  register: zfs_pool_check_timer_status

- name: Enable and start the ZFS health metrics timer
  ansible.builtin.systemd:
    name: zfs_health_metrics.timer
    enabled: true
    state: started

- name: Seed ZFS health metrics
  ansible.builtin.systemd:
    name: zfs_health_metrics.service
    state: started
  changed_when: false
