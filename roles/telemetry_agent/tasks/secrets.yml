---
# Every value here can be supplied directly (extra-vars, host_vars) instead of
# through BWS -- the lookups are skipped when the value is already defined,
# matching the gmail_notifications role.

# kvk-klaus-homelab-prod-klaus-toyota-internal-domain
- name: "Get secret from BWS: telemetry internal domain"
  when:
    - telemetry_agent_internal_domain | length == 0
    - telemetry_agent_bws_internal_domain_id | length > 0
  ansible.builtin.set_fact:
    telemetry_agent_internal_domain: "{{ lookup('community.general.bitwarden_secrets_manager', telemetry_agent_bws_internal_domain_id).value }}" # yamllint disable-line rule:line-length

# kvk-telemetry-prod-klaus-k8s-<hostname>-a-api-key
- name: "Get secret from BWS: telemetry API key"
  when:
    - telemetry_agent_api_key is not defined
    - telemetry_agent_bws_api_key_id | length > 0
  ansible.builtin.set_fact:
    telemetry_agent_api_key: "{{ lookup('community.general.bitwarden_secrets_manager', telemetry_agent_bws_api_key_id).value }}" # yamllint disable-line rule:line-length
  no_log: true

# Fail here rather than three tasks later with a template error naming a
# variable, or -- worse -- an agent that installs cleanly and pushes to
# `https://prometheus-push.prod./api/v1/write` forever.
- name: "Verify the push configuration is complete"
  ansible.builtin.assert:
    that:
      - telemetry_agent_internal_domain | length > 0
      - telemetry_agent_api_key is defined
      - telemetry_agent_api_key | length >= 32
    fail_msg: >-
      telemetry_agent is enabled but has no valid client API key. Set
      telemetry_agent_bws_api_key_id in this host's inventory vars (it is
      per-host), and
      telemetry_agent_bws_internal_domain_id in the role defaults -- or pass
      telemetry_agent_api_key and telemetry_agent_internal_domain directly.
    quiet: true
  no_log: true
