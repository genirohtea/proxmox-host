---
# Settings for spinpid2.py (dual fan-zone controller).
# Values copied from the original spinpid2.config.
# This file is validated against spinpid2.schema.yaml at startup.

output:
  # ipmitool command. For a VM you may need remote options, e.g.
  #   "ipmitool -H <host> -U <user> -P <password>"
  # Leave null to auto-detect ipmitool on PATH.
  ipmitool: null
  # Main log file. Relative paths are resolved against this settings file's
  # directory (so ../spinpid2.log matches the original script location).
  log_file: ../spinpid2.log
  # Also echo log output to the console/stdout (good for testing).
  console: true
  # CPU output is sent to a separate log for interim cycles. It can get big,
  # so turn off after testing.
  cpu_log_enable: false
  cpu_log: ../cpu.log
  # Atomically scraped by Alloy's embedded node_exporter textfile collector.
  prometheus_file: /var/lib/node_exporter/textfile_collector/proxmox_ipmi_fans.prom

fan:
  # Supermicro says:
  #   Zone 0 - CPU/System fans (headers FAN1, FAN2, ...)
  #   Zone 1 - Peripheral fans (headers FANA, FANB, ...)
  # Default here puts drive-cooling fans on FAN1-4 and CPU fan on FANA.
  zone_cpu: 0
  zone_periph: 1
  # Min/max duty cycle to avoid stalling or running flat out.
  duty_cpu_min: 5
  duty_cpu_max: 100
  # Raised from 20 to sit at the drive zone's thermal equilibrium rather than
  # below it. Measured on this host: at 20% duty the two 4 TB NVMe climb to
  # ~67 C, at 31% they fall to ~58 C, so they balance near 25%. With a floor of
  # 20 every downswing undershot equilibrium and guaranteed a reheat, leaving
  # the loop cycling even after the kd and setpoint retune. See the drive
  # section for why this host controls on solid state rather than the pool HDDs.
  duty_periph_min: 25
  duty_periph_max: 100
  # Measured fan RPMs (via spintest.sh) at 30% and 100% duty cycle.
  # rpm_cpu_* is for FANA if zone_cpu=1 or FAN4 if zone_cpu=0; rpm_periph_* is
  # for the other fan.
  rpm_cpu_30: 2660
  rpm_cpu_max: 4340
  rpm_periph_30: 560
  rpm_periph_max: 1680
  # How to determine the current fan duty (% of full power):
  #   1 -> read it from the board (normal)
  #   0 -> assume it is where it was last set (for boards that misreport)
  how_duty: 1

drive:
  # Setpoint mean drive temperature (C).
  #
  # Raised from the original 40 because this host no longer controls on spinning
  # drives. The eight 18 TB pool HDDs sit behind the LSI SAS2008 HBA, which the
  # vfio_bind role binds to vfio-pci for the NAS VM, so they are invisible to
  # lshw and never enter the average. What remains is all solid state, and only
  # four devices report a temperature spinpid2 can parse: two 4 TB NVMe that
  # idle near 51-53 C and two SATA SSDs near 31 C, giving a mean of ~43 C with
  # the fans at their 20% floor.
  #
  # A setpoint of 40 is therefore below the resting temperature, so the loop can
  # never settle: it ramps, overcools, drops to the floor, and reheats. 48 sits
  # above that resting mean with margin, which keeps the fans at minimum until
  # something is genuinely warm. Because two cool SSDs dilute the mean, a mean of
  # 48 corresponds to roughly 66 C on the NVMe -- still well under their ~80 C
  # throttle point, so the ramp still happens in time to matter.
  setpoint: 48
  # Interval for checking drives (main cycle; minutes). Drives change
  # temperature slowly; 5 minutes is usually frequent enough.
  interval_minutes: 5
  # Tunable PID constants for drive control (see tuning notes in spinpid2.sh).
  #
  # kd was 40, tuned for the thermal inertia of 18 TB spinning drives. NVMe
  # respond far faster -- these swung 12 C within one 5 minute interval -- which
  # made the derivative term (+-56) swamp the proportional term (+-16) and drove
  # the duty cycle between the 20% floor and ~90% in a self-sustaining
  # oscillation with a period of exactly two sample intervals. 8 keeps enough
  # derivative action to anticipate a real climb without dominating the loop.
  kp: 4
  kd: 8

cpu:
  # Interval for checking the CPU (seconds). 1 to 12 may be appropriate.
  interval_seconds: 5
  # Reference temperature (C) for scaling CPU duty (NOT a setpoint). At and
  # below this temperature the CPU demands the minimum duty cycle.
  ref: 54
  # Additional duty-cycle percentage points per degree above ref.
  scale: 6
