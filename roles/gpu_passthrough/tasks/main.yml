---
# tasks file for gpu_passthrough
- name: "Enable GPU passthrough"
  when: allow_reboot and graphics_card is defined
  block:
    - name: "Enable IOMMU"
      tags: iommu_enable
      include_role:
        name: iommu_enable

    - name: "Load VFIO modules"
      tags: vfio_driver_fix
      include_role:
        name: vfio_driver_fix

    # These carry the vfio_bind tag as well as gpu_passthrough: they are what
    # discovers the GPU IDs that vfio_bind renders. Running `--tags vfio_bind`
    # without them would rewrite vfio.conf with the GPU dropped.
    - name: "Enable AMD GPU passthrough"
      ansible.builtin.import_tasks: amd.yml
      when: graphics_card == 'AMD'
      tags: vfio_bind
    - name: "Enable NVIDIA GPU passthrough"
      ansible.builtin.import_tasks: nvidia.yml
      when: graphics_card == 'NVIDIA'
      tags: vfio_bind
    - name: "Enable Intel Arc GPU passthrough"
      ansible.builtin.import_tasks: intel.yml
      when: graphics_card == 'Intel'
      tags: vfio_bind

    # Render /etc/modprobe.d/vfio.conf. The vendor tasks above only discovered
    # the card and set vfio_bind_gpu_*; vfio_bind is the single writer and also
    # merges any vfio_bind_extra_* devices declared for this host (HBAs, NVMe).
    - name: "Write the vfio-pci binding"
      tags: vfio_bind
      ansible.builtin.include_role:
        name: vfio_bind

    # The initramfs rebuild is notified by vfio_bind and must happen *before*
    # the reboot below, not at the end of the play.
    - name: "Flush handlers so the initramfs is rebuilt before rebooting"
      ansible.builtin.meta: flush_handlers

    - name: "Reboot the system again for changes to take effect"
      ansible.builtin.reboot:
        msg: "Rebooting to apply GPU passthrough changes"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: uptime
      when: allow_reboot

    - name: "Validate that passthrough succeeded"
      ansible.builtin.import_tasks: validate.yml
  rescue:
    - name: "GPU Passthrough failed"
      ansible.builtin.set_fact:
        task_failed: true
