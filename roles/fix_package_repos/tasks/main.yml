---
# tasks file for fix_package_repos
#
# Debian 12 (bookworm / Proxmox VE 8) uses classic one-line ".list" APT sources.
# Debian 13 (trixie / Proxmox VE 9) uses the deb822 ".sources" format. Detect the
# release and dispatch to the matching handler so each host type is configured
# in its native format.

- name: "Configure APT repositories (Debian bookworm / Proxmox VE 8)"
  ansible.builtin.import_tasks: bookworm.yml
  when: ansible_facts['distribution_release'] == "bookworm"

- name: "Configure APT repositories (Debian trixie / Proxmox VE 9)"
  ansible.builtin.import_tasks: trixie.yml
  when: ansible_facts['distribution_release'] == "trixie"

- name: "Fail on an unsupported Debian release"
  ansible.builtin.fail:
    msg: >-
      fix_package_repos only supports Debian bookworm and trixie; detected
      '{{ ansible_facts['distribution_release'] }}'.
  when: ansible_facts['distribution_release'] not in ["bookworm", "trixie"]

- name: "Update package cache (debian)"
  ansible.builtin.apt:
    update_cache: true
    autoclean: true
    autoremove: true
    purge: true

# Needs to be done after package repos are set-up correctly
- name: "Install the sudo form of root access"
  ansible.builtin.apt:
    package: sudo
    state: present
    update_cache: true
  become: true
  become_method: ansible.builtin.su # Default proxmox
