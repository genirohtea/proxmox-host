---
# Persist the SR-IOV Virtual Function count on the GPU Physical Function and
# validate that the VFs come up. Driver-agnostic: works for the Alder Lake iGPU
# (i915, PF at 00:02.0) and a discrete Battlemage card (xe, PF on its own bus).

- name: "Install sysfsutils (persists sysfs attributes across reboots)"
  ansible.builtin.apt:
    name: sysfsutils
    state: present

- name: "Verify the configured PF is an Intel GPU with SR-IOV capability"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      lspci -D -nnks 0000:{{ pcie_bus_number }}
  args:
    executable: /bin/bash
  register: pf_lspci
  changed_when: false

- name: "Display the PF device information"
  ansible.builtin.debug:
    msg: "{{ pf_lspci.stdout_lines }}"

- name: "Assert the PF is bound to the expected driver"
  ansible.builtin.assert:
    that:
      - "'Kernel driver in use: ' + intel_gpu_driver in pf_lspci.stdout"
    fail_msg: "PF 0000:{{ pcie_bus_number }} is not bound to '{{ intel_gpu_driver }}'. Check module/blacklist config."

# Resolve the canonical /sys device path (e.g. /sys/devices/pci0000:00/0000:00:02.0
# for the iGPU, or a nested bridge path for a dGPU) so the sysfs.conf entry is
# correct regardless of PCIe topology.
- name: "Resolve the canonical sysfs path for the PF"
  ansible.builtin.command:
    cmd: readlink -f /sys/bus/pci/devices/0000:{{ pcie_bus_number }}
  register: pf_sysfs_link
  changed_when: false

- name: "Compute the sysfs.conf-relative PF path"
  ansible.builtin.set_fact:
    pf_sysfs_relpath: "{{ pf_sysfs_link.stdout | regex_replace('^/sys/', '') }}"

- name: "Configure sysfs to enable the Virtual Functions on the PF"
  ansible.builtin.lineinfile:
    path: "{{ sysfs_conf_file }}"
    regexp: "^{{ pf_sysfs_relpath | regex_escape }}/sriov_numvfs ="
    line: "{{ pf_sysfs_relpath }}/sriov_numvfs = {{ intel_gpu_num_vfs }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: "Read back the sysfs.conf configuration"
  ansible.builtin.command:
    cmd: cat {{ sysfs_conf_file }}
  register: sysfs_conf_content
  changed_when: false

- name: "Display the sysfs.conf contents"
  ansible.builtin.debug:
    msg: "{{ sysfs_conf_content.stdout_lines }}"

- name: "Verify sysfs.conf contains the VF configuration"
  ansible.builtin.assert:
    that: "'sriov_numvfs = ' + (intel_gpu_num_vfs | string) in sysfs_conf_content.stdout"
    fail_msg: "Expected 'sriov_numvfs = {{ intel_gpu_num_vfs }}' not found in {{ sysfs_conf_file }}."

- name: "Notify about MOK enrollment on the next boot (Secure Boot hosts only)"
  ansible.builtin.debug:
    msg: "If Secure Boot is enabled, perform MOK management enrollment on the upcoming reboot."

- name: "Reboot to apply the new kernel command line and create the VFs"
  ansible.builtin.reboot:
    msg: "Force a reboot to use the new kernel commandline"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
    post_reboot_delay: 30
    test_command: uptime
  when: allow_reboot

- name: "Read back the live VF count from the PF"
  ansible.builtin.command:
    cmd: cat /sys/bus/pci/devices/0000:{{ pcie_bus_number }}/sriov_numvfs
  register: live_numvfs
  changed_when: false

- name: "Assert the expected number of VFs are live"
  ansible.builtin.assert:
    that:
      - live_numvfs.stdout | int == intel_gpu_num_vfs | int
    fail_msg: "PF reports {{ live_numvfs.stdout }} VFs; expected {{ intel_gpu_num_vfs }}."

- name: "Check the dmesg log for the GPU driver"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      dmesg | grep -i {{ intel_gpu_driver }}
  args:
    executable: /bin/bash
  register: boot_log_check
  changed_when: false

- name: "Display the driver messages from dmesg"
  ansible.builtin.debug:
    msg: "{{ boot_log_check.stdout_lines }}"

- name: "Assert the driver reports the Virtual Functions enabled"
  ansible.builtin.assert:
    that:
      - "'Enabled ' + (intel_gpu_num_vfs | string) + ' VFs' in boot_log_check.stdout"
    fail_msg: "{{ intel_gpu_num_vfs }} VFs are not enabled per dmesg. Please troubleshoot."
