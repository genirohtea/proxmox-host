---
# Keep the Proxmox subscription reminder patch in place after upgrades to
# proxmox-widget-toolkit. This follows the implementation used by the
# community-scripts Post-PVE-Install script.

- name: "Remove the legacy fake subscription package"
  ansible.builtin.apt:
    name: pve-fake-subscription
    state: absent
    purge: true
  become: true
  become_method: ansible.builtin.su

- name: "Install the subscription nag removal script"
  ansible.builtin.copy:
    src: pve-remove-nag.sh
    dest: /usr/local/bin/pve-remove-nag.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  become_method: ansible.builtin.su

- name: "Run the subscription nag removal after package operations"
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/no-nag-script
    owner: root
    group: root
    mode: "0644"
    content: |
      DPkg::Post-Invoke { "/usr/local/bin/pve-remove-nag.sh"; };
  become: true
  become_method: ansible.builtin.su

- name: "Apply the subscription nag removal now"
  ansible.builtin.command: /usr/local/bin/pve-remove-nag.sh
  register: disable_subscription_nag_result
  changed_when: "'Patching' in disable_subscription_nag_result.stdout"
  become: true
  become_method: ansible.builtin.su
