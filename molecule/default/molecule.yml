---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: "proxmoxhost-${image:-debian12}-${tag:-latest}-${TOX_ENVNAME}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    # Proxmox 8.1 is currently based on bookworm
    # Proxmox images doesn't like testing on an ARM base platform
    # image: makedie/proxmox_ve:8.0.4
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
      # ansible-core 2.19 made non-boolean `when:` expressions a hard error.
      # molecule-plugins 23.x -- the newest series compatible with molecule
      # 6.0.2 -- ships `when: (lookup('env', 'HOME'))` in its own docker
      # destroy.yml, so every `molecule destroy` fails before it reaches our
      # code. Upstream fixed it in 25.8.12 with `is truthy`, but that release
      # requires molecule >= 25.1.0, which is a separate migration.
      #
      # Scoped to molecule only; the production ansible.cfg keeps the strict
      # default. Remove once molecule and molecule-plugins are both upgraded.
      allow_broken_conditionals: true
  env:
    ANSIBLE_VERBOSITY: 3
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  inventory:
    host_vars:
      instance:
        allow_reboot: true
        pinned_kernel_version: "6.5.13-3-pve"
