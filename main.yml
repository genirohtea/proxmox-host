---
- name: "Install the various proxmox roles"
  hosts: all
  pre_tasks:
    - name: Verify Ansible is version 2.21 or above. (If this fails you may need to update Ansible)
      assert:
        that: "ansible_version.full is version_compare('2.21', '>=')"
        msg: >
          "Ansible is out of date."
  roles:
    - role: disable_subscription_nag
      tags: disable_subscription_nag
    - role: fix_package_repos
      tags: fix_package_repos
    - role: remove_kernels
      tags: remove_kernels
      when: "'pve' in hostvars[inventory_hostname].ansible_facts.kernel"
    - role: cpu_microcode
      tags: cpu_microcode
    - role: scaling_governor
      tags: scaling_governor
    # Every role that stages or removes kernel command line parameters must run BEFORE
    # gpu_passthrough, which reboots the host from inside iommu_enable. A role
    # placed after it stages its parameter into /etc/kernel/cmdline with no
    # further reboot in the play, so the change sits pending until someone
    # reboots by hand -- and the symptom (a setting that "did not apply") shows
    # up nowhere near the ordering that caused it.
    - role: hugepages
      tags: hugepages
    - role: intel_graphics
      tags: intel_graphics
    - role: ipmi_fan_control
      tags: ipmi_fan_control
    - role: gpu_passthrough
      tags: gpu_passthrough
    # Hosts with a GPU get vfio.conf written inside gpu_passthrough (before its
    # reboot). This covers hosts that pass through non-GPU devices only, so a
    # missing graphics_card never means a missing HBA/NVMe binding.
    - role: vfio_bind
      tags: vfio_bind
      when: graphics_card is not defined

    - role: nvidia_vgpu
      tags: nvidia_vgpu
    - role: coral
      tags: coral
    # - role: terraform_user
    #   tags: terraform_user
    - role: admin_user
      tags: admin_user
    # Storage content types come before download_isos: that role writes ISOs to
    # `local`, which must already carry the content types it needs.
    - role: pve_storage
      tags: pve_storage

    - role: download_isos
      tags: download_isos
    - role: zfs
      tags: zfs
    - role: disk_health
      tags: disk_health
    - role: google_drive_mount
      tags: google_drive_mount
      vars:
        folder_names:
          - "proxmox_etc_backups/{{ inventory_hostname }}/"
        site: "{{ hostvars[inventory_hostname].site }}"
        deploy_env: "prod"
    - role: gmail_notifications
      tags: gmail_notifications
